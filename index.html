<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<base href="/">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Down for Maintenance — Felix Feger</title>
<meta name="description" content="felixfeger.com is down for maintenance and will be back soon.">
<link rel="icon" type="image/x-icon" href="favicon.ico">
<style>
/* Standalone on purpose: no dependency on css/style.css or js/site.js,
   so this page still works if the rest of the site is unavailable.
   Colors, fonts and components are copied from css/style.css. */

@import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Inter:wght@400;500;600&display=swap');

:root {
  --bg: #F5F1E8;
  --bg-raised: #ECE5D3;
  --ink: #3A362C;
  --ink-soft: #6B6355;
  --line: #D9D0BA;
  --teal: #3E6B6B;
  --teal-deep: #2C4D4D;
  --on-teal: #fff;

  color-scheme: light dark;

  --font-display: 'Quicksand', sans-serif;
  --font-body: 'Inter', sans-serif;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1f1d19;
    --bg-raised: #2a2721;
    --ink: #efe9da;
    --ink-soft: #b4ab96;
    --line: #403b31;
    --teal: #8bbcc2;
    --teal-deep: #8bbcc2;
    --on-teal: #1f1d19;
  }

  .brand-logo {
    filter: invert(1);
    mix-blend-mode: screen;
  }
}

* { box-sizing: border-box; }

html, body { height: 100%; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  display: flex;
  flex-direction: column;
}

img { max-width: 100%; display: block; }

a { color: var(--teal-deep); text-decoration: none; }
a:hover { text-decoration: underline; }

a:focus-visible {
  outline: 2px solid var(--teal);
  outline-offset: 3px;
}

h1, h3 {
  font-family: var(--font-display);
  font-weight: 700;
  color: var(--ink);
  margin: 0 0 0.5em;
  line-height: 1.15;
}

p { max-width: 62ch; }

/* Top bar */
.site-header {
  border-bottom: 1px solid var(--line);
}

.site-header .inner {
  max-width: 980px;
  margin: 0 auto;
  padding: 0 24px;
  height: 64px;
  display: flex;
  align-items: center;
}

.brand-logo {
  height: 36px;
  width: auto;
  mix-blend-mode: multiply;
}

/* Hero */
main {
  flex: 1;
  display: flex;
  flex-direction: column;
}

.hero {
  padding: 96px 24px 72px;
  text-align: center;
}

.wave-icon {
  width: 64px;
  height: auto;
  margin: 0 auto 28px;
  color: var(--teal);
}

.hero h1 {
  font-size: clamp(2.4rem, 6vw, 3.6rem);
}

.hero .tagline {
  color: var(--ink-soft);
  font-size: 1.15rem;
  margin: 0 auto 32px;
}

.btn {
  display: inline-block;
  border: 1.5px solid var(--teal-deep);
  color: var(--teal-deep);
  font-family: var(--font-display);
  font-weight: 600;
  padding: 12px 30px;
  border-radius: 999px;
  background: transparent;
  cursor: pointer;
}

.btn:hover {
  background: var(--teal-deep);
  color: var(--on-teal);
  text-decoration: none;
}

/* Wave + contact band */
.wave-divider {
  display: block;
  width: 100%;
  height: 48px;
  color: var(--bg-raised);
}

.contact-band {
  flex: 1;
  background: var(--bg-raised);
  padding: 40px 24px 72px;
}

.contact-card {
  max-width: 420px;
  margin: 0 auto;
  border: 1px solid var(--line);
  background: var(--bg);
  padding: 26px 22px;
  text-align: center;
}

.contact-card h3 {
  font-size: 1.1rem;
  margin-bottom: 6px;
}

.contact-card p {
  color: var(--ink-soft);
  font-size: 0.92rem;
  margin: 0 auto 14px;
}

.contact-card a {
  font-weight: 600;
  font-size: 0.95rem;
}
</style>
</head>
<body>

<header class="site-header">
  <div class="inner">
    <img class="brand-logo" src="logo.png" alt="Office of Felix Feger">
  </div>
</header>

<main>
  <section class="hero">
    <svg class="wave-icon" viewBox="0 0 64 40" fill="none"
         xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M2 10 Q10 2 18 10 T34 10 T50 10 T62 10"
            stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
      <path d="M2 20 Q10 12 18 20 T34 20 T50 20 T62 20"
            stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
      <path d="M2 30 Q10 22 18 30 T34 30 T50 30 T62 30"
            stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
    </svg>

    <h1>Down for Maintenance</h1>
    <p class="tagline">We're making a few updates and will be back soon.</p>
    <a href="mailto:hello@felixfeger.com" class="btn">Contact Me</a>
  </section>

  <svg class="wave-divider" viewBox="0 0 1200 60"
       preserveAspectRatio="none" aria-hidden="true">
    <path d="M0,30 C150,60 350,0 600,30
             C850,60 1050,0 1200,30
             L1200,60 L0,60 Z"
          fill="currentColor"/>
  </svg>

  <section class="contact-band">
    <div class="contact-card">
      <h3>Need something?</h3>
      <p>In the meantime, you can reach me by email.</p>
      <a href="mailto:hello@felixfeger.com">hello@felixfeger.com</a>
    </div>
  </section>
</main>

</body>
</html>
